<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente dello sfondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#376bfb"/>
      <stop offset="100%" stop-color="#8241f9"/>
    </linearGradient>
    
    <!-- Leggera ombra per dare tridimensionalità alle forme bianche -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Forma base dell'icona (Squircle) -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bordo interno sottile per effetto premium -->
  <rect width="100" height="100" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>

  <!-- Logo centrale -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <!-- Quadrato in alto a sinistra -->
    <rect x="28" y="28" width="16" height="16" rx="0.5" />
    
    <!-- Quadrato in basso a sinistra -->
    <rect x="28" y="56" width="16" height="16" rx="0.5" />
    
    <!-- Quadrato in basso a destra -->
    <rect x="56" y="56" width="16" height="16" rx="0.5" />
    
    <!-- Rombo in alto a destra (quadrato ruotato di 45 gradi dal suo centro) -->
    <rect x="56" y="28" width="16" height="16" rx="0.5" transform="rotate(45 64 36)" />
  </g>
</svg>
